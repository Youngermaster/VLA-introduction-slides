deck:
  title: From Tokens to Torque
  subtitle: How AI learned to move things in the physical world
  author: Juan Manuel Younes
  venue: AI Medellín

nav:
  act: Act

# --- ACT 1 · THE HOOK -------------------------------------------------------
hook:
  title: Why did ChatGPT explode and robots didn't?
  body: |
    In three years we went from "AI writes strange sentences" to half the world
    using it every day.

    Robots have been promising the same thing for just as long. They still
    haven't arrived.
  aside: The answer isn't that robots are harder. It's that the data is a different kind of thing.

asymmetry:
  title: The asymmetry that explains everything
  cite: Open X-Embodiment (arXiv:2310.08864) · Llama 3 (arXiv:2407.21783)

# --- ACT 2 · HOW WE GOT HERE ------------------------------------------------
act2:
  title: How we got here
  sub: From hand-written trajectories to policies that learn on their own.

timeline:
  title: Three eras in five years

reflex:
  title: What ACT actually is
  cite: ACT / ALOHA — Zhao, Kumar, Levine and Finn 2023 (arXiv:2304.13705)

build:
  title: I built one to understand it
  lead: |
    A complete SO-101 — leader and follower — printed on a Creality Ender 3 V3 KE.
  points: |
    - Tuned print tolerances until the holes stopped eating the screws (X-Y compensation).
    - Six Feetech STS3215 servos on a shared serial bus, driven by a Waveshare board.
    - Three USB cameras: overhead, wrist and base.
    - ACT policies trained with LeRobot on an RTX 5060 Ti.
  aside: |
    None of this is biography. It is the reason I know exactly **where** each
    thing I am about to describe breaks.

limitation:
  title: Where ACT runs out
  body: |
    My policy picked up a red cube perfectly.

    I put a blue cube next to it and it still went for the red one. I moved the
    red one ten centimetres and it failed. I spoke to it, and of course,
    nothing happened.
  punch: One policy, one task. Every new task means recording and training all over again.

# --- ACT 3 · HOW VLAs WORK --------------------------------------------------
act3:
  title: How a VLA works
  sub: The technical part. Three components, two key ideas, and one compression trick.

architecture:
  title: Three components
  cite: RT-2 — Brohan et al. 2023 (arXiv:2307.15818) · SmolVLA — Shukor et al. 2025 (arXiv:2506.01844)

pipeline:
  title: Where the data comes from
  cite: LeRobot · lerobot-record → LeRobotDataset v3 → lerobot-train

tokenizer:
  title: From continuous motion to tokens
  cite: FAST — Pertsch et al. 2025 (arXiv:2501.09747) · π₀ (arXiv:2410.24164)

chunking:
  title: Predict a block, not a step
  cite: ACT — Zhao et al. 2023 (arXiv:2304.13705) · Real-Time Chunking — Black, Galliker and Levine 2025 (arXiv:2506.07339)

pretrain:
  title: What pretraining buys
  cite: SmolVLA — Shukor et al. 2025 (arXiv:2506.01844)

inside:
  title: So where did ACT go in all this?

rt2:
  title: The RT-2 insight
  body: |
    A VLM that has never seen a robot already knows what a bottle is, what
    "red" means, and that fragile things are handled carefully.

    RT-2 showed that this knowledge **transfers to physical control**: you don't
    have to teach the robot what an object is, only how to move toward it.
  punch: |
    That is why a VLA generalizes where ACT does not. It isn't that it learns
    better — it **starts out knowing far more**.
  cite: RT-2 — Brohan et al. 2023 (arXiv:2307.15818) · the CoRL version is cited as Zitkovich et al.

