es:
  title: Lo que todavía *no funciona*
  c1: Benchmarks saturados
  c1f: Todos sacan 97 o 98 en el mismo examen. Ya *no dice* quién es mejor.
  axis: 'LIBERO, % de tareas logradas'
  band: todos aquí
  what: Un benchmark es *un examen estándar.*
  whatf: Las mismas tareas, en simulación, para todos los modelos. Así se comparan los papers.
  sat: 'Saturado significa que todos ya sacan *97 o 98.* El examen se volvió fácil y dejó de separar a los buenos de los mejores.'
  why: POR QUÉ IMPORTA
  whyf: Un *98 % en LIBERO* no te dice cómo le va a ir en tu mesa, con tu luz y tus objetos.
  c2: La prueba de verdad es un robot real
  c2f: RoboArena compara políticas a ciegas, A contra B, en robots reales de 7 laboratorios.
  c2g: 'DROID: *76k* trayectorias, *350 h*, *50* personas, *12* meses.'
  c3: Frágil fuera de sus datos
  c3f: Cambia la luz o mueve una cámara y puede fallar. Y tiene que pensar rápido, OpenVLA va a *~6 Hz*.
  punch: 'La *diversidad* gana al volumen: escenas y objetos nuevos enseñan más que repetir la misma demo.'
  cite: 'LIBERO: OpenVLA-OFT, Cosmos Policy, LaWAM · RoboArena arXiv:2506.18123 · DROID arXiv:2403.12945 · Lin et al. arXiv:2410.18647'
en:
  title: What still *doesn't work*
  c1: Saturated benchmarks
  c1f: Everyone scores 97 or 98 on the same exam. It *no longer tells* who is better.
  axis: 'LIBERO, % of tasks completed'
  band: everyone is here
  what: A benchmark is *a standard exam.*
  whatf: The same tasks, in simulation, for every model. It's how papers compare themselves.
  sat: 'Saturated means everyone already scores *97 or 98.* The exam got easy and stopped separating the good from the best.'
  why: WHY IT MATTERS
  whyf: A *98 % on LIBERO* doesn't tell you how it will do on your table, with your light and your objects.
  c2: The real test is a real robot
  c2f: RoboArena compares policies blind, A against B, on real robots across 7 labs.
  c2g: 'DROID: *76k* trajectories, *350 h*, *50* people, *12* months.'
  c3: Fragile outside its data
  c3f: Change the light or nudge a camera and it can fail. And it has to think fast, OpenVLA runs at *~6 Hz*.
  punch: '*Diversity* beats volume: new scenes and objects teach more than repeating the same demo.'
  cite: 'LIBERO: OpenVLA-OFT, Cosmos Policy, LaWAM · RoboArena arXiv:2506.18123 · DROID arXiv:2403.12945 · Lin et al. arXiv:2410.18647'
