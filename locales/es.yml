  pretrain:
    tag1: fase 1 · lo hizo otro
    h1: Pre-entrenamiento
    p1: >-
      SmolVLA: **481 datasets de la comunidad**, 22.9K episodios, 10.6M frames.
      Meses de GPU que tú no pagas.
    arrow: descargas los pesos
    tag2: fase 2 · lo haces tú
    h2: Fine-tuning
    p2: >-
      **~50 episodios** de tu tarea, en tu mesa, con tu luz. Unas horas de GPU.
    punch: >-
      Sin la fase 1, 50 episodios no alcanzan ni de lejos. Con ella, alcanzan.
      **Eso es todo lo que significa «modelo fundacional» en robótica.**

