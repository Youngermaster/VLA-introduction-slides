  cite: FAST — Pertsch et al. 2025 (arXiv:2501.09747) · π₀ (arXiv:2410.24164)

chunking:
  title: Predecir un bloque, no un paso
  cite: ACT — Zhao et al. 2023 (arXiv:2304.13705) · Real-Time Chunking — Black, Galliker y Levine 2025 (arXiv:2506.07339)

pretrain:
  title: Qué compra el pre-entrenamiento
  cite: SmolVLA — Shukor et al. 2025 (arXiv:2506.01844)

inside:
  title: ¿Y dónde quedó ACT dentro de todo esto?

rt2:
  title: La intuición de RT-2
  body: |
    Un VLM que nunca vio un robot ya sabe qué es un frasco, qué significa
    "rojo" y que las cosas frágiles se agarran con cuidado.

    RT-2 mostró que ese conocimiento **transfiere al control físico**: no hay
    que enseñarle al robot qué es un objeto, sólo cómo moverse hacia él.
  punch: |
    Por eso un VLA generaliza donde ACT no. No es que aprenda mejor —
    es que **empieza sabiendo mucho más**.
  cite: RT-2 — Brohan et al. 2023 (arXiv:2307.15818) · versión CoRL citada como Zitkovich et al.

