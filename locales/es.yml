# --- ACTO 1 · EL GANCHO -----------------------------------------------------
hook:
  title: ¿Por qué ChatGPT explotó y los robots no?
  body: |
    En tres años pasamos de "la IA escribe frases raras" a que medio mundo
    la use todos los días.

    Los robots llevan el mismo tiempo prometiendo lo mismo. Y siguen sin llegar.
  aside: La respuesta no es que los robots sean más difíciles. Es que los datos son distintos.

asymmetry:
  title: La asimetría que lo explica todo
  cite: Open X-Embodiment (arXiv:2310.08864) · Llama 3 (arXiv:2407.21783)

# --- ACTO 2 · CÓMO LLEGAMOS AQUÍ -------------------------------------------
act2:
  title: Cómo llegamos aquí
  sub: De trayectorias escritas a mano a políticas que aprenden solas.

timeline:
  title: Tres eras en cinco años

reflex:
  title: Qué es ACT, exactamente
  cite: ACT / ALOHA — Zhao, Kumar, Levine y Finn 2023 (arXiv:2304.13705)

build:
  title: Lo construí para entenderlo
  lead: |
    Un SO-101 completo — líder y seguidor — impreso en una Ender 3 V3 KE.
  points: |
    - Ajusté las tolerancias de impresión hasta que los agujeros dejaron de comerse los tornillos (compensación X-Y).
    - Seis servos Feetech STS3215 en un bus serie compartido, con una placa Waveshare.
    - Tres cámaras USB: cenital, muñeca y base.
    - Políticas ACT entrenadas con LeRobot en una RTX 5060 Ti.
  aside: |
    Nada de esto es un detalle biográfico. Es el motivo por el que sé
    exactamente **dónde** se rompe cada cosa que voy a contar.

limitation:
  title: Donde ACT se queda corto
  body: |
    Mi política agarraba un cubo rojo perfectamente.

    Le puse un cubo azul al lado y siguió yendo por el rojo. Le puse el rojo
    diez centímetros más allá y falló. Le hablé, y por supuesto, no pasó nada.
  punch: Una política, una tarea. Para cada tarea nueva, vuelves a grabar y a entrenar.

