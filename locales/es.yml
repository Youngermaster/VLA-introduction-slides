inside:
  title: ¿Y dónde quedó ACT dentro de todo esto?

rt2:
  title: La intuición de RT-2
  body: |
    Un VLM que nunca vio un robot ya sabe qué es un frasco, qué significa
    "rojo" y que las cosas frágiles se agarran con cuidado.

    RT-2 mostró que ese conocimiento **transfiere al control físico**: no hay
    que enseñarle al robot qué es un objeto, sólo cómo moverse hacia él.
  punch: |
    Por eso un VLA generaliza donde ACT no. No es que aprenda mejor —
    es que **empieza sabiendo mucho más**.
  cite: RT-2 — Brohan et al. 2023 (arXiv:2307.15818) · versión CoRL citada como Zitkovich et al.

# --- ACTO 4 · EL PANORAMA ---------------------------------------------------
act4:
  title: Qué hay disponible hoy
  sub: Y qué de eso corre de verdad en tu hardware.

landscape:
  title: El panorama, con números reales
  cite: |
    Cifras verificadas contra las fuentes primarias en septiembre de 2026.
    openpi · NVIDIA Isaac GR00T · LeRobot

access:
  title: Esto ya está a tu alcance
  lead: |
    En 2023 esto necesitaba un TPU pod. Hoy cabe en un escritorio.
  points: |
    - **SmolVLA: 450M parámetros.** 350M de VLM (media pila de SmolVLM2) + 100M de action expert. 64 tokens visuales por frame.
    - Entrenado con **10.6M frames de 481 datasets** de la comunidad — no de un laboratorio frontera.
    - **Supera a π₀ (3.3B)** en tareas reales de SO-100: 78.3% frente a 61.7%.
    - Inferencia asíncrona: 9.7 s frente a 13.75 s por tarea, y el doble de ciclos completados.
  punch: |
    El brazo cuesta unos 150 dólares. El modelo es abierto. El dataset lo grabas tú
    en una tarde. **Ese es el cambio real.**
  cite: SmolVLA — Shukor et al. 2025 (arXiv:2506.01844) · lerobot/smolvla_base

