# ---------------------------------------------------------------------------
# Texto dentro de los componentes de visualización.
# Vive aquí y no dentro de los .vue para que el deck sea realmente bilingüe:
# los títulos ya se traducían, pero las etiquetas de los diagramas no.
# Prosa siempre en `>-` — un escalar plano con ": " rompe el YAML.
# ---------------------------------------------------------------------------
c:
  asymmetry:
    textLabel: TEXTO
    textSub: se recolecta
    actionLabel: ACCIÓN
    actionSub: hay que actuarla
    textUnit: >-
      tokens de texto — el corpus de entrenamiento de Llama 3
    actionUnit: >-
      episodios en Open X-Embodiment — 34 laboratorios, años de trabajo
    punch: >-
      El texto ya estaba escrito. **Cada episodio de robot hay que vivirlo en
      tiempo real.**

  policy:
    legendA: >-
      qué hacer ahora y durante el próximo segundo — un bloque, no un paso
    legendO: >-
      imágenes de las cámaras + estado de las articulaciones
    legendL: >-
      la instrucción en texto
    read: >-
      Una **política** es sólo eso: una función que, dado lo que el robot ve y
      lo que le pediste, devuelve qué hacer.
    readHi: >-
      ACT no tiene el tercer término. Un VLA sí.
    noteTag: >-
      y algo que confunde a todo el mundo
    noteBody: >-
      Esto **no** es reinforcement learning. No hay recompensa, no hay
      exploración, no hay ensayo y error. Es **behavior cloning**: aprendizaje
      supervisado puro, donde la etiqueta es lo que hizo el humano.

  attention:
    selfTag: self-attention
    selfWho: >-
      el backbone · igual que en ChatGPT
    selfSeq: >-
      una sola secuencia: imagen + texto
    selfFrom: >-
      las tres salen de la misma secuencia
    selfP: >-
      El mismo mecanismo, la misma matemática y las mismas librerías que un
      modelo de texto.
    crossTag: cross-attention
    crossWho: >-
      el action expert · aquí sí cambia
    crossKv: VLM → K, V
    crossQ: acciones → Q
    crossFrom: >-
      Q viene de las acciones, K y V del VLM
    crossP: >-
      Las acciones **preguntan**, el VLM **responde**. Y como el prefijo se
      cachea, el VLM corre **una vez** por ciclo y el experto diez.
    maskTag: >-
      y una diferencia más, en la máscara
    maskPrefix: imágenes + texto
    maskPrefixSub: bidireccional
    maskState: estado
    maskStateSub: su propio bloque
    maskAct: 50 acciones
    maskActSub: >-
      causal en SmolVLA · bidireccional en π₀
    maskNote: >-
      No es el triángulo causal de un LLM de texto: es **prefix-LM por
      bloques**. Tiene sentido — un parche de imagen no tiene «antes» ni
      «después».
    punch: >-
      Entonces sí: el 90% de un VLA es el transformer que ya conoces. **Lo
      nuevo son las últimas capas y la máscara**.

  chunking:
    s1k: un paso a la vez
    s1v: >-
      El brazo se detiene en cada inferencia. Cada predicción ignora la anterior.
    s2k: action chunking
    s2v: >-
      Una inferencia devuelve ~50 acciones futuras. Entre decisiones, el
      movimiento es continuo.
    s3k: el problema de la costura
    s3v: >-
      Mientras se ejecuta un chunk, el siguiente ya se está calculando — y
      vuelve en desacuerdo con dónde está el brazo.
    s4k: real-time chunking
    s4v: >-
      El solapamiento se rellena (inpainting) para que los chunks concuerden.
      En LeRobot, --inference.type=rtc
    chunk: chunk

  loop:
    obs: observar
    obsSub: 3 cámaras + estado
    enc: tokenizar
    encSub: parches + instrucción
    vlm: VLM
    vlmSub: self-attention
    head: action expert
    headSub: cross-attention
    dec: de-tokenizar
    decSub: a grados y milímetros
    exec: ejecutar
    execSub: el chunk, a 30 Hz
    hzSub: todo el ciclo
    note: >-
      **El chunk es lo que permite que el bucle no tenga que cerrarse en cada
      paso** — por eso el movimiento se ve continuo y no a tirones.

  pipeline:
    s1t: Teleoperación
    s1b: >-
      Mueves el brazo líder; el seguidor copia. 30 s por episodio, en tiempo real.
    s2t: Episodio
    s2b: >-
      3 vídeos sincronizados + estado de las 6 articulaciones a 30 Hz + la
      instrucción en texto.
    s3t: Dataset
    s3b: >-
      ~50 episodios por tarea, repartidos entre variaciones — posición del
      objeto, iluminación, distractores.
    s4t: Entrenamiento
    s4b: >-
      La política aprende a predecir la acción que tomó el humano, dadas las
      mismas observaciones.

  reflex:
    images: Imágenes
    imagesSub: 3 cámaras · 30 Hz
    state: Estado
    stateSub: 6 articulaciones
    core: ACT
    coreSub: CVAE + transformer
    out: Chunk de acciones
    outSub: ~90–100 pasos
    lang: «agarra el frasco de magnesio»
    langX: no hay dónde conectarlo
    punch: >-
      ACT es un **reflejo**. Extraordinariamente bueno en la tarea que vio, y
      completamente sordo. Cambias el objeto y falla; le hablas y no pasa nada.

  timeline:
    e1y: hasta ~2020
    e1t: Control programado
    e1b: >-
      Cinemática inversa y trayectorias escritas a mano. Funciona perfecto —
      hasta que algo se mueve un centímetro.
    e2y: '2023'
    e2t: Imitation learning
    e2b: >-
      ACT y Diffusion Policy. Aprende de demostraciones humanas. Sin lenguaje,
      sin razonamiento: un reflejo muy bueno.
    e3y: 2023–24
    e3t: Los primeros VLA
    e3b: >-
      RT-2 muestra que el conocimiento de internet transfiere al control
      físico. OpenVLA lo abre.
    e4y: 2025–26
    e4t: Al alcance
    e4b: >-
      SmolVLA (450M), π₀.₅, GR00T N1.7. Entrenables en una GPU de consumo.
      164 papers de VLA en ICLR 2026.

  tokenizer:
    trajTitle: trayectoria — 1 articulación
    specTitle: espectro (DCT)
    footRaw: 7 articulaciones · 50 Hz · números reales
    footBin: >-
      la escalera es el error de cuantización: precisión perdida para siempre
    footSpec: >-
      casi toda la energía vive en las frecuencias bajas — por eso comprime tan bien
    tokensUnit: tokens / chunk
    f1n: Binning por dimensión
    f1note: >-
      256 bins por dimensión. 7 DoF × 50 pasos = 350 tokens autoregresivos por chunk.
    f2n: FAST
    f2note: >-
      DCT + cuantización + BPE. El mismo truco que JPEG — decorrelar, tirar lo
      agudo, comprimir motivos.
    f3n: Action expert continuo
    f3note: >-
      Sin tokens. Flow matching genera el chunk completo en unos pocos pasos de
      denoising.

  detok:
    hId: token id
    hBin: bin 0–255
    hNorm: normalizado
    hReal: unidades reales
    grip: cerrar
    step1: >-
      el vocabulario se reutiliza — los 256 tokens menos usados se sobrescriben
      con acciones
    step2: >-
      256 tokens, pero 255 cajones reales — el clásico off-by-one
    step3: >-
      se des-normaliza con los percentiles del dataset, no con min y max, para
      que una demostración mala no estire la escala
    punch: >-
      Las seis primeras son **deltas** — el modelo no dice «ve a esta
      coordenada», dice «muévete cuatro milímetros hacia allá». La séptima, la
      pinza, es la excepción: es absoluta y no se des-normaliza.

  langin:
    s1: 1 · lo que dices
    s2: 2 · se envuelve en una plantilla fija
    s3: 3 · el tokenizador de siempre
    s4: 4 · y se concatena con la imagen
    sentence: «agarra el frasco de magnesio»
    promptVar: agarra el frasco de magnesio
    note2: >-
      El modelo no aprende una tarea nueva: sigue haciendo predicción del
      siguiente token, sobre una pregunta que ya sabe contestar.
    note3: >-
      Sub-palabras, exactamente el mismo BPE que usa el modelo de texto.
      «magnesio» se parte en dos, y no pasa nada.
    legVis: tokens de imagen
    legLang: tokens de texto
    legNote: >-
      una sola secuencia — el transformer no distingue

  recording:
    leader: brazo líder · lo mueve el humano
    follower: brazo seguidor · el que graba
    copies: el seguidor copia
    rowTag: un renglón por timestep, a 30 Hz
    noteState: dónde ESTÁ el seguidor
    noteAction: dónde lo MANDÓ el humano
    noteTask: la instrucción
    punch: >-
      Fíjate en esas dos filas: **no son lo mismo**. `observation.state` es
      dónde está el robot; `action` es dónde lo mandó el humano. Entrenar la
      política es aprender a predecir la segunda a partir de la primera.

  arch:
    cams: cámaras
    camTop: cenital
    camWrist: muñeca
    camBase: base
    instruction: instrucción
    visionName: Vision encoder
    coreName: VLM preentrenado
    coreNote: >-
      Aquí vive el conocimiento de internet. Es la razón de que un VLA
      generalice donde ACT no.
    headName: Action expert
    headWho: flow matching · ~100M
    outTag: chunk de acciones
    outNote: 50 pasos futuros, ~1 s de movimiento

  inside:
    hIn: Entrada
    hRep: Representación
    hHead: Cabeza de acción
    hOut: Salida
    hLang: Entiende lenguaje
    hGen: Generaliza a objetos nuevos
    aIn: imágenes + estado del robot
    vIn: imágenes + estado + instrucción
    aRep: ResNet entrenado desde cero
    vRep: VLM preentrenado en internet
    aHead: transformer CVAE → chunk
    vHead: action expert → chunk
    aOut: ~100 acciones futuras
    vOut: ~50 acciones futuras
    no: 'no'
    yes: sí
    some: algo
    punch: >-
      La cabeza de acción de un VLA **es** una política de chunking. Lo que
      cambió no es el músculo — es lo que le habla al músculo.

  chess:
    l1n: Stockfish
    l1r: razona sobre ajedrez
    l1note: >-
      Evalúa millones de posiciones. No sabe que existe un brazo.
    l2n: python-chess + orquestador
    l2r: traduce
    l2p: 2 operaciones atómicas
    l2note: >-
      Una captura son DOS operaciones: retirar la pieza comida, luego mover el
      caballo. Una promoción, tres.
    l3n: Visión del tablero
    l3r: ancla al mundo
    l3note: >-
      Aquí muere el ajedrez. Lo único que cruza la frontera son coordenadas.
    l4n: Política ACT
    l4r: agarra y suelta
    l4note: >-
      ACT no sabe qué es un caballo ni que hay una partida. Aprendió a agarrar
      cosas en coordenadas.
    frontier: aquí muere el lenguaje de ajedrez

  econ:
    tag1: lo que cuesta un dataset
    tag2: y lo que compras con ellos
    d1: trayectorias
    d2: horas de interacción
    d3: escenas
    d4: personas recolectando
    d5: instituciones
    d6: meses
    p1: >-
      Eso es **DROID**, uno solo. Tres continentes, hardware idéntico, un año.
      La unidad real no son dólares por hora — son **años-institución**.
    lead2: >-
      La generalización escala con la **diversidad** de escenas y objetos,
      siguiendo una ley de potencias. Las demostraciones adicionales *por
      escena* se saturan rápido.
    p2: >-
      Es decir: no estás pagando por volumen. Estás pagando por variedad — y
      ahí es donde casi todo el mundo gasta mal su presupuesto.

  landscape:
    hModel: Modelo
    hParams: Params
    hOpen: Abierto
    hMem: Memoria
    yes: sí
    no: 'no'
    n1: >-
      La idea fundacional: el conocimiento de internet transfiere al control.
    n2: >-
      El primer VLA abierto serio. Llama 2 + DINOv2 + SigLIP, 256 bins.
    n3: >-
      PaliGemma + action expert por flow matching. π₀.₇ ya existe, pero cerrado.
    n4: >-
      Backbone Cosmos-Reason2. 8.9 Hz en un AGX Thor montado en el robot.
    n5: >-
      Supera a π₀ (3.3B) en tareas reales de SO-100. Este es el que corre en tu mesa.
    v3: 22.5 GB LoRA · >70 GB completo
    v4: 16 GB inferencia · ~35 GB fine-tune
    v5: una sola GPU

  openvla:
    imgTag: imagen
    instrTag: instrucción
    instr: «put eggplant in bowl»
