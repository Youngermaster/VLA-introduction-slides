    b2: MLP projector
    b3: Llama tokenizer
    b3s: el de texto, sin cambios
    seqTag: una sola secuencia
    coreS: predice el siguiente token · ~6 Hz en una RTX 4090
    actsTag: 7 tokens de acción
    detok: Action de-tokenizer
    detokS: tokens 31744–31999 → milímetros y grados
    vecNote: 7 DoF · deltas, salvo la pinza

  smolvla:
    vlmTitle: Vision-Language Model
    vlmSub: SmolVLM2-500M · 64 tokens visuales por frame · d=960
    expertTitle: Action Expert
    expertSub: ~100M · 16 capas · d=720 (75% del VLM)
    cut: se queda con 16 de 32 capas
    dropped: descartada
    layer: capa
    chipCams: 3 cámaras
    chipTask: 'task: «agarra el frasco»'
    chipState: state
