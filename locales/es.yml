  sub: Y qué de eso corre de verdad en tu hardware.

landscape:
  title: El panorama, con números reales
  cite: |
    Cifras verificadas contra las fuentes primarias en septiembre de 2026.
    openpi · NVIDIA Isaac GR00T · LeRobot

access:
  title: Esto ya está a tu alcance
  lead: |
    En 2023 esto necesitaba un TPU pod. Hoy cabe en un escritorio.
  points: |
    - **450M parámetros.** 350M de VLM + 100M de action expert.
    - **10.6M frames de 481 datasets** de la comunidad, no de un laboratorio frontera.
    - **Supera a π₀ (3.3B)** en tareas reales de SO-100: 78.3% frente a 61.7%.
  punch: |
    El brazo cuesta unos 150 dólares. El modelo es abierto. El dataset lo grabas tú
    en una tarde. **Ese es el cambio real.**
  cite: SmolVLA — Shukor et al. 2025 (arXiv:2506.01844) · lerobot/smolvla_base

choose:
  title: Cuándo usar cuál

# --- ACTO 5 · DEMO EN VIVO --------------------------------------------------
act5:
  title: Demo en vivo
  sub: A mitad de charla, a propósito — si falla, todavía me queda media charla para recuperarme.

rig:
  title: Qué hay montado aquí

demo:
  title: El momento que importa
  lead: |
    Mismo robot. Mismo modelo. Mismos pesos. Lo único que cambia es la frase.
  instr1: agarra el Complejo B
  instr2: agarra el frasco de magnesio
  body: |
    No hay un `if` en ninguna parte. La instrucción entra por el mismo sitio
    que las imágenes, y el comportamiento cambia.
  punch: Eso es un VLA. Todo lo demás de esta charla es explicar cómo llega hasta ahí.

demoact:
  title: Y para comparar — la misma tarea con ACT
  body: |
    ACT hace su tarea muy bien. Pero la hace **igual** sin importar lo que yo diga.
  placeholder: VÍDEO — política ACT ejecutando la tarea grabada

backup:
  title: Demo grabado
  sub: Por si el robot decide no colaborar.
  placeholder: VÍDEO — demo completo grabado con antelación
  note: Tecla B para llegar aquí desde cualquier diapositiva. Tecla V para volver.

# --- ACTO 6 · REALIDAD Y LÍMITES -------------------------------------------
act6:
  title: La parte honesta
  sub: Dónde estamos de verdad, y qué todavía no funciona.

adoption:
  title: El campo se movió muy rápido
  lead: |
    Papers de VLA enviados a ICLR:
  n2024: '1'
  n2025: '9'
  n2026: '164'
  l2024: en 2024 — y fue rechazado
  l2025: en 2025
  l2026: en 2026
  body: |
    18× en un año. La proyección del autor de ese análisis para 2027 es de más
    de mil.
  aside: |
    Hay cifras circulando sobre adopción industrial — que los VLA respaldan ya
    el 40% de los despliegues nuevos — pero vienen de un informe de mercado
    privado sin metodología publicada. Las menciono como dirección, no como dato.
  cite: Análisis de ICLR 2026 — Moritz Reuss, 164 envíos analizados

limits:
  title: Lo que todavía no funciona
  points: |
    - **Benchmarks saturados.** LIBERO vive entre 95% y 99%. Ya no distingue nada.
    - **Y esconden la brecha real.** En RoboArena — robots físicos, a ciegas, entre laboratorios — la foto es muy distinta.
    - **Latencia.** Pensar un chunk tarda más que ejecutarlo. Por eso existe RTC.
    - **Generalización frágil.** Cambia la luz o mueve una cámara y se cae.
  punch: |
    Si alguien te enseña un 98% en LIBERO, no te está diciendo casi nada
    sobre lo que pasa en una mesa real.
  cite: RoboArena — Atreya, Pertsch et al. 2025 (arXiv:2506.18123, CoRL 2025) · LIBERO (arXiv:2306.03310)

economics:
  title: Por qué los datos cuestan lo que cuestan
  cite: DROID — Khazatsky, Pertsch et al. 2024 (arXiv:2403.12945, RSS 2024) · Data Scaling Laws — Lin et al. 2024 (arXiv:2410.18647, ICLR 2025 Oral)

# --- ACTO 7 · LECCIÓN DE ARQUITECTURA --------------------------------------
act7:
  title: Una lección de arquitectura
  sub: Un robot que juega ajedrez — y por qué la política no sabe jugar.

chess:
  title: Robot ajedrecista — las capas

lesson:
  title: El ajedrez muere antes de llegar a la política
  body: |
    Una captura son dos operaciones de agarrar y soltar. El enroque, dos.
    Una promoción, tres. La política las ejecuta todas exactamente igual,
    porque para ella son lo mismo: ve coordenadas y agarra.
  punch: |
    **La lección no es de modelos, es de sistemas.** Pon el razonamiento donde
    hay razonamiento y el músculo donde hay músculo, y que se encuentren en el
    punto más estrecho posible — aquí, un par de coordenadas.
  aside: Diseñado, todavía no construido.

# --- ACTO 8 · FUTURO --------------------------------------------------------
act8:
  title: Hacia dónde va esto
  sub: De reaccionar a imaginar.

world:
  title: Modelos del mundo
  cite: V-JEPA 2 — Assran et al. 2025 (arXiv:2506.09985) · Cosmos 3 (arXiv:2606.02800) · VLA-JEPA en LeRobot

generalist:
  title: ¿Y en qué se diferencia esto de los modelos generalistas?
  lead: |
    Los modelos que están de moda son generalistas de **texto e imagen**.
    Un VLA es un generalista de **acción**. La diferencia no es de tamaño.
  points: |
    - Un LLM se equivoca y reescribes el prompt. Un VLA **tira un frasco al suelo**.
    - Un LLM se evalúa con benchmarks. Un VLA sólo **en una mesa física**, y cada mesa es distinta.
    - Un LLM aprende de datos que ya existían. Un VLA necesita **generarlos moviendo un robot**.
  punch: |
    El cuello de botella de los LLM era el cómputo. El de los VLA es
    **el mundo físico** — y ese no escala con comprar más GPUs.

question:
  title: Entonces, ¿cuál es el cuello de botella?
  a: Datos
  adesc: No existen a escala web, y generarlos cuesta años-institución.
  b: Arquitectura
  bdesc: Nadie ha demostrado todavía la receta que claramente gana.
  cc: Hardware
  cdesc: Manos baratas y fiables siguen sin existir.
  punch: Mi apuesta es que son los datos. Pero la pregunta sigue abierta, y por eso el campo está tan divertido.

