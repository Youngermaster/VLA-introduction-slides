:root{--bg:#E6E9FF;--fg:#0A1250;--dim:#4A5496;--rail:#C3C9F2;--accent:#1F3BFF;--knob:#1F3BFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060B33;--fg:#EEF0FF;--dim:#8C95D6;--rail:#1E2A7A;--accent:#FFD400;--knob:#FFD400}}
:root[data-theme="dark"]{--bg:#060B33;--fg:#EEF0FF;--dim:#8C95D6;--rail:#1E2A7A;--accent:#FFD400;--knob:#FFD400}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'IBM Plex Mono',ui-monospace,monospace;min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:min(100%,1280px);padding:24px 20px}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#0A1250;border-radius:6px;overflow:hidden;cursor:pointer;box-shadow:0 30px 80px -30px rgba(10,18,80,.55)}
canvas{display:block;width:100%;height:100%}
.bar{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:14px}
button{font:inherit;color:var(--fg);background:transparent;border:1.5px solid var(--rail);border-radius:999px;height:40px;min-width:40px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
input[type=range]{flex:1;min-width:60px;accent-color:var(--knob);height:40px;background:transparent}
.tc{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
h1{font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(18px,2.4vw,26px);margin:0 0 14px;letter-spacing:-.01em}
p.note{color:var(--dim);font-size:13px;margin:14px 0 0;line-height:1.6}
@media (max-width:560px){.tc{display:none}}
body.capture{background:#000;display:block}
body.capture main{padding:0;width:1920px}
body.capture .stage{width:1920px;height:1080px;border-radius:0;box-shadow:none}
body.capture h1,body.capture .bar,body.capture .note{display:none}
</style>
</head>
<body>
<main>
  <h1>LibreYOLO VLA / 15-second showreel</h1>
  <div class="stage" id="stage"><canvas id="c" width="1920" height="1080" aria-label="Animated LibreYOLO showreel"></canvas></div>
  <div class="bar">
    <button id="play" aria-label="Pause">❚❚</button>
    <input id="scrub" type="range" min="0" max="15000" value="0" aria-label="Scrub timeline">
    <span class="tc" id="tc">00.00 / 15.00</span>
    <button id="snd" aria-pressed="false">Sound off</button>
  </div>
  <p class="note">Click the frame or press space to pause. Turn sound on for the synced score. Arrow keys step a frame.</p>
</main>
<script>(() => {
const W = 1920, H = 1080, DUR = 15;
const C = { cobalt:'#1F3BFF', navy:'#0A1250', paper:'#EEF0FF', signal:'#FFD400', coral:'#FF4F6D', mist:'#D7DCFF', deep:'#16248F' };
const D = "'Unbounded', 'Arial Black', sans-serif", M = "'IBM Plex Mono', 'Courier New', monospace";

// ---------- math ----------
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOX = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eIX = k => k <= 0 ? 0 : Math.pow(2, 10 * k - 10);
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eOB = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const mod = (a, n) => ((a % n) + n) % n;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

let cv, ctx;

// ---------- impacts / shake ----------
const IMPACTS = [[2.0, 14], [4.0, 8], [7.5, 14], [9.25, 10], [10.0, 16], [10.25, 16], [10.5, 16], [12.0, 30], [12.5, 18], [13.25, 14]];
function shake(t) {
  let x = 0, y = 0, r = 0;
  IMPACTS.forEach(([ti, a], i) => {
    const d = t - ti; if (d < 0 || d > .5) return;
    const e = a * Math.exp(-d * 11);
    x += e * Math.sin(d * 95 + i * 1.7); y += e * Math.cos(d * 83 + i * 2.3); r += e * .0009 * Math.sin(d * 70 + i);
  });
  return { x, y, r, m: Math.hypot(x, y) };
}
function flash(t) { let f = 0; [[2.0, .35], [5.5, .2], [10.0, .3], [12.0, .45], [12.5, .25]].forEach(([ti, a]) => { const d = t - ti; if (d >= 0 && d < .3) f = Math.max(f, a * Math.exp(-d * 14)); }); return f; }

// ---------- drawing helpers ----------
function font(w, s, fam = D) { ctx.font = `${w} ${s}px ${fam}`; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function line(a, b, c, d) { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); }

function detBox(x, y, w, h, o) {
  const { col = C.signal, lw = 5, k = 1, label, conf = 1, labelK = 1, textCol = C.navy, alpha = 1, bracket = true } = o;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = 'miter';
  if (k < 1) { const per = 2 * (w + h); ctx.setLineDash([per * k, per * 2]); }
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.stroke();
  ctx.setLineDash([]);
  if (bracket && k >= 1) {
    const b = Math.min(38, w * .25, h * .25), o2 = lw * 1.4; ctx.lineWidth = lw * 2.2; ctx.lineCap = 'square';
    [[x - o2, y - o2, 1, 1], [x + w + o2, y - o2, -1, 1], [x + w + o2, y + h + o2, -1, -1], [x - o2, y + h + o2, 1, -1]].forEach(([px, py, sx, sy]) => {
      ctx.beginPath(); ctx.moveTo(px + b * sx, py); ctx.lineTo(px, py); ctx.lineTo(px, py + b * sy); ctx.stroke();
    });
  }
  if (label && labelK > 0) {
    font(500, 26, M);
    const txt = `${label}  ${conf.toFixed(2)}`, tw = ctx.measureText(txt).width + 30;
    const cw = tw * eOX(labelK), ch = 46, cy = y - ch - lw / 2 > 10 ? y - ch - lw / 2 : y + lw / 2;
    ctx.fillStyle = col; ctx.fillRect(x - lw / 2, cy, cw, ch);
    ctx.save(); ctx.beginPath(); ctx.rect(x - lw / 2, cy, cw, ch); ctx.clip();
    ctx.fillStyle = textCol; ctx.textBaseline = 'middle'; ctx.fillText(txt, x - lw / 2 + 15, cy + ch / 2 + 1); ctx.restore();
  }
  ctx.restore();
}

// letters rising through a mask line; exitK sends them up and out
function riseText(str, x, y, size, weight, col, t0, t, { stagger = .028, dur = .42, exitT = null, align = 'left', clipH = 1.25 } = {}) {
  font(weight, size); ctx.textBaseline = 'alphabetic';
  const full = ctx.measureText(str).width;
  let sx = align === 'center' ? x - full / 2 : x;
  ctx.save(); ctx.beginPath(); ctx.rect(sx - 60, y - size * clipH, full + 120, size * (clipH + .35)); ctx.clip();
  ctx.fillStyle = col;
  for (let i = 0; i < str.length; i++) {
    const px = sx + ctx.measureText(str.slice(0, i)).width;
    const k = eOX(pr(t, t0 + i * stagger, t0 + i * stagger + dur));
    let dy = (1 - k) * size * 1.25;
    if (exitT !== null) { const ek = eIX(pr(t, exitT + i * .012, exitT + i * .012 + .22)); dy -= ek * size * 1.3; }
    ctx.fillText(str[i], px, y + dy);
  }
  ctx.restore();
  return { x: sx, w: full };
}

// iris / aperture: open 0 = closed, 1 = fully open
function aperture(open, t) {
  if (open >= 1) return;
  const r = lerp(0, 1250, open), rot = lerp(1.1, 0, open) + t * .15, n = 8;
  const pts = []; for (let i = 0; i < n; i++) { const a = rot + i * Math.PI * 2 / n; pts.push([W / 2 + Math.cos(a) * r, H / 2 + Math.sin(a) * r]); }
  ctx.save(); ctx.fillStyle = C.navy; ctx.beginPath(); ctx.rect(-100, -100, W + 200, H + 200);
  if (r > 0.5) { ctx.moveTo(...pts[0]); for (let i = n - 1; i >= 0; i--) ctx.lineTo(...pts[i]); ctx.closePath(); }
  ctx.fill('evenodd');
  ctx.strokeStyle = '#243299'; ctx.lineWidth = 5;
  for (let i = 0; i < n; i++) { const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % n]; const dx = ax - bx, dy = ay - by, L = Math.hypot(dx, dy) || 1; line(ax, ay, ax + dx / L * 2600, ay + dy / L * 2600); }
  ctx.restore();
}

// ---------- grain ----------
let grains = [];
function makeGrain() {
  for (let g = 0; g < 4; g++) {
    const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const d = x.createImageData(256, 256); const r = rng(99 + g);
    for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    x.putImageData(d, 0, 0); grains.push(c);
  }
}

// ---------- sound events ----------
const EV = [];
const ev = (t, type, g = 1, f = 0) => EV.push({ t, type, g, f });
PROMPT.forEach((_, i) => { ev(.2 + i * .2, 'blip', .6); ev(.2 + i * .2, 'click', .8); });

[2.6, 2.7, 2.8, 2.9].forEach(t => ev(t, 'blip', .6)); for (let t = 3.2; t < 3.9; t += .04) ev(t, 'tick', .12);

ev(12.5, 'hit', 1); ev(12.6, 'whoosh', .6); ev(13.25, 'thud', 1); ev(13.25, 'click', 1); ev(13.5, 'tick', .8); ev(14.4, 'whoosh', .9);

})();

<script>
(async () => {
  const capture = location.search.includes('capture');
  if (capture) document.body.classList.add('capture');
  const cv = document.getElementById('c');
  try { await Promise.all(["800 100px Unbounded","900 100px Unbounded","400 20px 'IBM Plex Mono'","500 20px 'IBM Plex Mono'"].map(f => document.fonts.load(f))); } catch (e) {}
  Reel.init(cv);
  const ctx = cv.getContext('2d');
  if (capture) { window.__renderAt = t => { Reel.render(t, 1); return true; }; window.__events = Reel.EV; window.__ready = true; return; }

  // sizing
  let scale = 1;
  function fit() { const r = cv.getBoundingClientRect(); const dpr = Math.min(window.devicePixelRatio || 1, 2); const w = Math.max(320, Math.min(1920, Math.round(r.width * dpr))); cv.width = w; cv.height = Math.round(w * 9 / 16); scale = w / 1920; Reel.render(t, scale); }
  let t = 0, playing = !matchMedia('(prefers-reduced-motion: reduce)').matches, last = null, prevT = 0;
  if (!playing) t = 13.2;
  addEventListener('resize', fit);

  let ac = null, master = null, noiseBuf = null, sound = false;
  function initAudio() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    master = ac.createGain(); master.gain.value = .7; master.connect(comp); comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const env = (g, t0, a, peak, dec) => { g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + dec); };

      case 'hat': noise('highpass', 7500, 9000, .05, .12 * g, .001, .045, at); break;
      case 'tick': osc('sine', 1900, 1700, .03, .22 * g, .04, at); break;
      case 'blip': osc('square', 880, 1500, .05, .07 * g, .08, at); break;

      case 'swish': noise('bandpass', 3000, 500, .25, .4 * g, .03, .22, at, 1); break;

      case 'bass': osc('triangle', e.f, e.f, .9, .35 * g, .9, at); break;

  const $ = id => document.getElementById(id);
  const playBtn = $('play'), scrub = $('scrub'), tc = $('tc'), snd = $('snd');
  function ui() { playBtn.textContent = playing ? '❚❚' : '▶'; playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play'); scrub.value = Math.round(t * 1000); tc.textContent = `${t.toFixed(2).padStart(5, '0')} / 15.00`; }
  function toggle() { playing = !playing; last = null; ui(); }

})();
